name: Build VPK
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libs
        run: yes | vdpm libvita2d curl-mbedtls jsoncpp minizip libpng libjpeg-turbo freetype zlib taipool libk
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: VPKGJ-Mod
          path: build/*.vpk
